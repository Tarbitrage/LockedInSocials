name: iOS build checks

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository contents
        run: python3 scripts/check_repo.py

  build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        app: [LockInGram, LockInTube]
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build ${{ matrix.app }} for iOS Simulator without signing
        run: |
          xcodebuild \
            -project "apps/${{ matrix.app }}/${{ matrix.app }}.xcodeproj" \
            -scheme "${{ matrix.app }}" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
